<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), clipboard-read=(), usb=(), midi=(), serial=(), display-capture=(), accelerometer=(), gyroscope=(), magnetometer=(), idle-detection=(), screen-wake-lock=(), browsing-topics=(), interest-cohort=()">
    <meta name="theme-color" content="#0e1228">
    <meta name="robots" content="noindex, nofollow">
    <title>Word Puzzle — Offline</title>
    <!--
        The app's shared design system first, then this game's own stylesheet, which is
        the order index.html uses. This page is what a player sees when the network is
        gone, so it is the worst possible place for it to render without the palette the
        rest of the app is in — and the worker precaches ../../theme.css for exactly this
        document, so the stylesheet is available offline whether or not it is requested.
    -->
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!--
            No wordmark here, same as index.html. This page shipped with the markup
            still in it after the game's own header was removed, and with the CSS that
            styled it gone — so offline, on a first visit with nothing cached, the title
            fell back to the UA default: a large black serif heading with default margins,
            inside the game's own glass panel.
        -->
        <div class="card">
            <h2>Offline</h2>
            <p>This page is not in the cache yet. Reconnect once to finish installing, then the game works fully offline.</p>
            <p><a href="./">Try again</a></p>
        </div>
        <p class="made-with">Made with ❤️ 🇬🇧 · <a href="https://ambr3.pages.dev/about/" target="_blank" rel="noopener noreferrer">About the author</a></p>
    </div>
</body>
</html>
